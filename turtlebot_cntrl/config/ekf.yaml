ekf_filter_node:
  ros__parameters:

    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    use_sim_time: true

    # Want the AMCL to listen to this
    publish_tf: true

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # -------------------------
    # Wheel odometry
    # -------------------------
    odom0: /odom

    # Order:
    # x, y, z,
    # roll, pitch, yaw,
    # vx, vy, vz,
    # vroll, vpitch, vyaw,
    # ax, ay, az

    odom0_config:
      [
        false, false, false,
        false, false, false,
        true,  true,  false,
        false, false, false,
        false, false, false
      ]

    odom0_differential: false
    odom0_relative: false

    # -------------------------
    # IMU
    # -------------------------
    imu0: /imu

    imu0_config:
      [
        false, false, false,
        false, false, true,
        false, false, false,
        false, false, true,
        false, false, false
      ]

    imu0_differential: false
    imu0_relative: false

    # We aren't using linear acceleration yet,
    # so this doesn't matter much right now.
    imu0_remove_gravitational_acceleration: true